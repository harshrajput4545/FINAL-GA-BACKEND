



name: Deploy Nodejs Application to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e

            echo "=================================="
            echo "Starting EC2 deployment"
            echo "=================================="

            echo "Changing to project directory..."
            cd /FINAL-GA-BACKEND

            echo "Verifying Git repository..."
            git rev-parse --show-toplevel

            echo "Fetching latest code from GitHub..."
            git fetch origin main

            echo "Updating working directory..."
            git reset --hard origin/main

            echo "Latest deployed commit:"
            git log -1 --oneline

            echo "Rebuilding and restarting Docker..."
            sudo docker compose up -d --build --force-recreate

            echo "Checking container status..."
            sudo docker compose ps

            echo "Waiting for API to become ready..."

            for i in $(seq 1 10); do
              if curl -fsS --max-time 3 http://127.0.0.1:8000/; then
                echo ""
                echo "API is responding successfully!"
                break
              fi

              echo "Attempt $i failed. Retrying in 3 seconds..."
              sleep 3

              if [ "$i" -eq 10 ]; then
                echo "API health check failed!"
                sudo docker compose logs --tail=100 app
                exit 1
              fi
            done

            echo "=================================="
            echo "Deployment completed successfully!"
            echo "=================================="
